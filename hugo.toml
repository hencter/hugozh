# ============================================================
#  Hugo 中文文档 · 社区翻译 —— 站点配置（https://hugozh.cn/）
#  要求：Hugo 0.158 或更高版本（标准版即可，不依赖 extended）
#  预览：hugo server     构建：hugo
# ============================================================

baseURL = "https://hugozh.cn/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "Hugo 中文文档"
enableRobotsTXT = true

# 站点未使用分类法，去掉自动生成的空 /tags/ 与 /categories/（否则会进 sitemap 且被索引）
disableKinds = ['taxonomy', 'term']
hasCJKLanguage = true
summaryLength = 70
timeZone = "Asia/Shanghai"

# 版本控制联动：开启后 Hugo 读取 Git 历史，
#   .GitInfo（提交哈希/作者/主题）与 :git 日期映射都可用。
# 依据：https://gohugo.io/methods/page/gitinfo/
enableGitInfo = true

# 多主题：从左到右优先级递减；项目自身的 layouts 永远先于所有主题。
# 查找顺序 = 项目 → hugo-docs-theme-zh（中文叠加层）→ hugo-docs-theme（版式基础层）
# 依据：https://gohugo.io/hugo-modules/theme-components/
#
# ⚠ 顶层标量键必须写在任何 [table] 之前：TOML 会把表头之后的裸键归入该表，
#   一旦 theme 落在 [frontmatter] 之后，就会变成 frontmatter.theme 而被静默忽略，
#   现象是「found no layout file for kind …」且页面数骤降。
theme = ["hugo-docs-theme-zh", "hugo-docs-theme"]

# 日期字段解析顺序：优先取 Git 提交时间，其次 front matter 的 lastmod / date。
# 这样「最后更新」反映真实提交，而不是手写日期。
# 依据：https://gohugo.io/configuration/all/#frontmatter
[frontmatter]
  lastmod = [':git', 'lastmod', 'date']
  date = ['date', ':git']

[params]
  description = "Hugo 官方文档全部 19 个一级章节、948 页的社区简体中文翻译（非官方），附英文原文链接，便于对照阅读。"
  tagline = "把 Hugo 带到中文世界"          # 首页主视觉的眉题
  # HTML lang / og:locale / JSON-LD inLanguage 用的语言标签。
  # 不用 site.Language.Locale：该字段自 0.158 才有，而部署平台可能跑更旧的 Hugo（如 0.147）。
  htmlLang = "zh-CN"
  repoURL = "https://github.com/hencter/hugozh"   # 公开仓库地址；显示为首页「查看源码」按钮
  upstream = "https://gohugo.io/"
  upstreamRepo = "https://github.com/gohugoio/hugoDocs"
  version = "v1.3.0"      # 站点版本，显示在页脚；与 Git tag 对应

  # SEO：留空即不输出对应标签
  ogImage = "/images/og-image.png"        # 社交分享图（1200×630，由 .translation/gen-brand-assets.py 生成）
  ogImageWidth = 1200                   # 分享图尺寸，供 og:image:width/height 使用
  ogImageHeight = 630
  twitterHandle = ""      # 如 "@gohugoio"，用于 twitter:site

# 站长平台所有权验证（head.html 读取；两项都留空即完全不输出）。
#   · 「HTML 标记」方式：在 Google Search Console / Bing 网站管理员工具里复制 content 值填到下面；
#   · 「HTML 文件」方式：不改这里，把平台下载的文件（google…html / BingSiteAuth.xml）放进 static/ 即可。
# 验证只影响站长工具能否读取抓取数据与提交 sitemap，不影响页面收录本身。
[params.verification]
  # google = "…"
  # bing   = "…"

# 首页落地页的「按任务分流」入口卡：想改内容时只动这里，不用碰模板。
# 每张卡：title（一句话任务）+ desc（达成什么）+ path（主入口）+ more（次要入口，0–3 个）。
[[params.home.cards]]
  title = "我是第一次用 Hugo"
  desc = "从装环境到浏览器里看到页面，15–20 分钟，每一步都有验证标准。"
  path = "/getting-started/quick-start/"
  more = ["/installation/", "/getting-started/directory-structure/"]
[[params.home.cards]]
  title = "我要安装 / 升级 Hugo"
  desc = "发行版、extended 与标准版的区别，各平台安装方式，以及装完怎么确认版本。"
  path = "/installation/"
  more = ["/installation/windows/", "/installation/macos/", "/installation/linux/"]
[[params.home.cards]]
  title = "我要写内容"
  desc = "前置元数据、页面包、图片与附件、分类法、菜单：内容组织与资源引用。"
  path = "/content-management/"
  more = ["/content-management/front-matter/", "/content-management/page-bundles/", "/content-management/taxonomies/"]
[[params.home.cards]]
  title = "我要改样式和模板"
  desc = "模板从哪来、怎么找、上下文里有什么；渲染钩子改 Markdown 到 HTML 的转换。"
  path = "/templates/introduction/"
  more = ["/templates/lookup-order/", "/render-hooks/introduction/", "/hugo-pipes/introduction/"]
[[params.home.cards]]
  title = "我要查某个函数 / 方法"
  desc = "313 个函数与 268 个方法，每页给出「什么时候用、怎么用、边界是什么」。"
  path = "/functions/"
  more = ["/methods/", "/quick-reference/functions/", "/quick-reference/glossary/"]
[[params.home.cards]]
  title = "我要把站点发上线"
  desc = "发布与部署的区别、命令行部署，以及 11 个托管平台的完整步骤与要填的变量。"
  path = "/host-and-deploy/"
  more = ["/commands/hugo/", "/configuration/introduction/", "/tools/search/"]
[[params.home.cards]]
  title = "构建失败了，报错看不懂"
  desc = "按症状分诊：命令找不到 / 没报错但结果不对 / 报错看不懂，各自怎么确认、怎么修。"
  path = "/troubleshooting/"
  more = ["/troubleshooting/faq/", "/troubleshooting/inspection/", "/troubleshooting/audit/"]
[[params.home.cards]]
  title = "我要把它交给 AI 代理"
  desc = "给代理的机器可读出口与作业手册：每页 Markdown、页面清单、llms.txt 与技能包。"
  path = "/skill/"
  more = ["/llms.txt", "/pages.json", "/skill/skill-manifest.json"]

# 首页「常用入口」：读者最常查的页，避免每次都要翻侧栏。
