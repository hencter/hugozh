  path = "/quick-reference/glob-patterns/"

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[markup]
  [markup.goldmark]
    # 与上游一致：把 LaTeX 公式原样透传给前端渲染器（否则 $$…$$ 会按字面显示）。
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block  = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
    [markup.goldmark.renderer]
      unsafe = true
    # 与上游 gohugo.io 一致：解析块级属性（如表格后的 {.no-wrap-first-col}）。
    # 不开这一项时，这类独立一行会被当作表格数据行，渲染出垃圾文本。
    [markup.goldmark.parser]
      # 与上游一致：为定义列表的描述项（dt）自动生成 id，否则 #minify、#vars 一类锚点全部失效。
      autoDefinitionTermID = true
      [markup.goldmark.parser.attribute]
        block = true
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menus]
  [[menus.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "入门"
    url = "/getting-started/"
    weight = 10
  [[menus.main]]
    name = "内容管理"
    url = "/content-management/"
    weight = 20
  [[menus.main]]
    name = "命令"
    url = "/commands/"
    weight = 30
  [[menus.main]]
    name = "Hugo 官网"
    url = "https://gohugo.io/"
    weight = 99

# ============================================================
#  面向 AI 代理的输出（GEO）
#  · md   ：每个内容页额外产出 index.md（正文 Markdown + 可引用的元数据），
#           让代理不必解析 20KB HTML；模板用 text/template（isPlainText）避免 HTML 转义。
#  · llms ：首页额外产出 /llms.txt（站点地图式的 AI 入口文件）。
#  键名依据：https://gohugo.io/configuration/output-formats/
#  模板命名规则 [page kind].[output format].[suffix]：
#  https://gohugo.io/configuration/output-formats/#template-lookup-order
# ============================================================
[mediaTypes.'text/markdown']
  suffixes = ['md']

[outputFormats.md]
  mediaType   = 'text/markdown'
  baseName    = 'index'
  isPlainText = true
  isHTML      = false

[outputFormats.pagesjson]
  mediaType   = 'application/json'
  baseName    = 'pages'
  isPlainText = true
  isHTML      = false
  notAlternative = true

[outputFormats.llms]
  mediaType   = 'text/plain'
  baseName    = 'llms'
  isPlainText = true
  isHTML      = false
  notAlternative = true

# 搜索索引：首页额外产出 /search.json，供客户端搜索在首次打开搜索框时按需拉取。
# 用 application/json + jsonify 输出（不在 <script> 里，编码正确）。
[outputFormats.searchindex]
  mediaType   = 'application/json'
  baseName    = 'search'
  isPlainText = true
  isHTML      = false
  notAlternative = true

[outputs]
  home = ['html', 'rss', 'llms', 'md', 'pagesjson', 'searchindex']
  section = ['html', 'rss', 'md']
  page = ['html', 'md']

# 首页 RSS 曾达 2.1MB / 884 条；限流到 50 条（依据 https://gohugo.io/configuration/services/）
[services.rss]
  limit = 50
