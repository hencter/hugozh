  path = "/functions/collections/where/"
[[params.home.quickLinks]]
  label = "time.Format"
  path = "/functions/time/format/"
[[params.home.quickLinks]]
  label = "css.Sass"
  path = "/functions/css/sass/"
[[params.home.quickLinks]]
  label = "images.Filter"
  path = "/functions/images/filter/"
[[params.home.quickLinks]]
  label = "hugo server"
  path = "/commands/hugo-server/"
[[params.home.quickLinks]]
  label = "hugo new content"
  path = "/commands/hugo-new-content/"
[[params.home.quickLinks]]
